# Keep this field. It is not required by the pnpm this repo normally builds with
# (11.1.3 handles a packages-less workspace file fine) but pnpm 9.9.0 refuses any
# command with "packages field missing or empty", and 9.9.0 is still installed at
# ~/.local/share/pnpm for the Android build. This repo is a single package, not a
# monorepo -- the file exists only to carry onlyBuiltDependencies, allowBuilds and
# overrides -- so '.' is the whole workspace.
#
# Correcting the commit that added this (4287d4d): it said pnpm 11 requires the
# field and seed-1's pnpm 10.26 does not. That is backwards. The failure came from
# `export PATH=$HOME/.local/share/pnpm:$PATH` -- a recipe copied from seed-1, where
# that path holds pnpm 10.26, onto a laptop where it holds 9.9.0. Nothing was broken
# for anyone who did not run that export.
packages:
  - '.'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: true
  prisma: set this to true or false
  sharp: true
  unrs-resolver: true
# Patched versions forced onto transitive dependencies with no fixed parent
# release. In-major bumps only — a cross-major override breaks the parent's
# expected API (picomatch 2->4 did exactly that in the explorer).
overrides:
  picomatch: '>=2.3.2 <3'
  socket.io-parser: '>=4.2.6'
  ws: '>=8.21.0'
  engine.io: '>=6.6.7'
  sharp: '>=0.35.0'
  postcss: '>=8.5.12'
  js-yaml: '>=4.1.1'
  flatted: '>=3.3.4'
  brace-expansion: '>=2.0.2'
  minimatch: '>=3.1.3'
